[project]
name = "integration-tests"
version = "0.1.0"
description = "CalDAV/CardDAV integration tests for the Baikal Docker image"
readme = "README.md"
authors = [
    { name = "Guillaume Le Pape", email = "gui.lepape25@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2==2.13.1",
    "ruff==0.16.8",
    "python-dotenv==1.2.3",
    "testcontainers==4.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
