name: Build

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read versions.env
        id: versions
        run: grep -v '^#' versions.env | grep -v '^$' >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          build-args: |
            BAIKAL_VERSION=${{ steps.versions.outputs.BAIKAL_VERSION }}
          tags: baikal:ci

      - name: Smoke test
        run: |
          docker run -d --name baikal-ci -p 8080:80 baikal:ci
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            if [ "$code" = "302" ]; then
              echo "Got HTTP $code, container is serving requests"
              exit 0
            fi
            sleep 1
          done
          echo "Container never became healthy"
          docker logs baikal-ci
          exit 1

      - name: Stop smoke test container
        if: always()
        run: docker rm -f baikal-ci

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.x"

      - uses: astral-sh/setup-uv@v6

      - name: Install test dependencies
        working-directory: integration_tests
        run: uv sync --locked

      - name: Run CalDAV/CardDAV integration tests
        working-directory: integration_tests
        run: uv run pytest -v
