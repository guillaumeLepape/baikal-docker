name: Release

on:
  push:
    tags:
      - "*.*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Derive BAIKAL_VERSION from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          BAIKAL_VERSION="${TAG%.*}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "baikal_version=$BAIKAL_VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4.2.0

      - uses: docker/setup-buildx-action@v4.3.0

      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BAIKAL_VERSION=${{ steps.version.outputs.baikal_version }}
          tags: |
            guillaumelepape/baikal:${{ steps.version.outputs.tag }}
            guillaumelepape/baikal:latest

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: guillaumelepape/baikal
