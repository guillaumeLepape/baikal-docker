name: Release

on:
  push:
    branches: [main]
    paths:
      - versions.env

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read versions.env
        id: versions
        run: grep -v '^#' versions.env | grep -v '^$' >> "$GITHUB_OUTPUT"

      - name: Tag commit
        id: tag
        run: |
          TAG="${{ steps.versions.outputs.BAIKAL_VERSION }}.${{ steps.versions.outputs.BUILD_VERSION }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4.2.0

      - uses: docker/setup-buildx-action@v4.3.0

      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BAIKAL_VERSION=${{ steps.versions.outputs.BAIKAL_VERSION }}
          tags: |
            guillaumelepape/baikal:${{ steps.tag.outputs.tag }}
            guillaumelepape/baikal:latest

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: guillaumelepape/baikal
          short-description: ${{ github.event.repository.description }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
